<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艾奧傑亞總部 - 管理權限</title>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@600&display=swap');
        :root { --paper: #c2915e; --ink: #2d1b0d; --gold: #c5a059; --blood: #8b0000; --dark: #1a0f08; --blue: #2e5a88; }
        * { box-sizing: border-box; }
        body { background: #050505 url('https://www.transparenttextures.com/patterns/dark-wood.png'); color: var(--ink); font-family: 'Noto Serif TC', serif; padding: 40px; }
        .admin-panel { background: var(--paper); max-width: 980px; margin: 0 auto; padding: 40px; border: 4px solid var(--dark); box-shadow: 0 0 40px #000; }
        h2 { font-family: 'Cinzel Decorative'; color: var(--blood); border-bottom: 2px solid var(--ink); text-align: center; }
        h3 { margin-top: 28px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
        .toolbar a { color: var(--blood); font-weight: bold; }
        .card { background: rgba(0,0,0,0.05); border: 1px solid var(--ink); padding: 15px; margin-top: 15px; overflow: hidden; }
        .card-title { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
        .status { color: var(--blood); font-weight: 900; text-transform: uppercase; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cinzel Decorative'; }
        .btn:disabled { cursor: not-allowed; opacity: 0.55; }
        .btn-approve { background: var(--blue); color: white; }
        .btn-delete { background: var(--blood); color: white; }
        .btn-muted { background: rgba(45, 27, 13, 0.2); color: var(--ink); }
        input, select { padding: 10px; margin: 5px; background: rgba(255,255,255,0.3); border: 1px solid var(--ink); }
        label { display: inline-flex; align-items: center; gap: 4px; margin: 4px 12px 4px 0; }
        .status-hint { text-align: center; font-weight: bold; background: rgba(0,0,0,0.1); padding: 14px; margin-bottom: 24px; }
        .empty { opacity: 0.75; padding: 12px 0; }
        .box { background: rgba(0,0,0,0.1); padding: 20px; margin-bottom: 30px; }
        .hidden { display: none; }
        .booking-row { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.12); border-left: 4px solid var(--blue); }
        @media (max-width: 720px) {
            body { padding: 16px; }
            .admin-panel { padding: 24px; }
            .toolbar { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="admin-panel">
        <div class="toolbar">
            <a href="index.html">← 返回前台</a>
            <button class="btn btn-muted" id="refreshBtn" type="button">重新整理</button>
        </div>
        <h2>GUILD ADMINISTRATION</h2>

        <div id="loginBox" class="box">
            <h3>主持人登入</h3>
            帳號：<input id="username" autocomplete="username">
            密碼：<input id="password" type="password" autocomplete="current-password">
            <button class="btn btn-approve" id="loginBtn" type="button">登入</button>
        </div>

        <div id="adminBox" class="hidden">
            <div class="box">
                <h3>發布冒險時段</h3>
                <p id="hostHint"></p>
                日期：<input type="date" id="opDate">
                開始：<input type="time" id="opStart" value="18:00">
                結束：<input type="time" id="opEnd" value="23:00">
                <div id="gameOptions"></div>
                <button class="btn btn-approve" id="addOpBtn" type="button">發布召集令</button>
                <button class="btn btn-muted" id="logoutBtn" type="button">登出</button>
            </div>
        </div>

        <div id="status-hint" class="status-hint">正在翻閱公會史冊...</div>

        <h3>班表與預約狀態</h3>
        <div id="shiftList"></div>
    </div>

<script>
    const API_URL = window.FF14_BOOKING_API_URL;
    let shifts = [];
    let hostSession = null;

    const statusHint = document.getElementById('status-hint');
    const loginBox = document.getElementById('loginBox');
    const adminBox = document.getElementById('adminBox');
    const hostHint = document.getElementById('hostHint');
    const gameOptions = document.getElementById('gameOptions');
    const shiftList = document.getElementById('shiftList');
    const addOpBtn = document.getElementById('addOpBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function setStatus(message) {
        statusHint.textContent = message;
    }

    async function getJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    function getJsonp(url) {
        return new Promise((resolve, reject) => {
            const callbackName = `handleAdminResponse_${Date.now()}_${Math.random().toString(36).slice(2)}`;
            const script = document.createElement('script');
            const timeout = window.setTimeout(() => {
                cleanup();
                reject(new Error('讀取資料逾時'));
            }, 10000);

            function cleanup() {
                window.clearTimeout(timeout);
                delete window[callbackName];
                script.remove();
            }

            window[callbackName] = (data) => {
                cleanup();
                resolve(data);
            };

            script.onerror = () => {
                cleanup();
                reject(new Error('無法讀取據點資料'));
            };
            script.src = `${url}&callback=${callbackName}`;
            document.body.appendChild(script);
        });
    }

    async function postJson(payload) {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        if (!result.success) throw new Error(result.message || '操作失敗');
        return result;
    }

    async function fetchData() {
        if (!API_URL) {
            setStatus('尚未設定 Google Apps Script API URL');
            return;
        }

        setStatus('正在翻閱公會史冊...');
        const url = `${API_URL}?action=getShifts&t=${Date.now()}`;
        try {
            let result;
            try {
                result = await getJson(url);
            } catch (error) {
                result = await getJsonp(url);
            }
            if (!result.success) throw new Error(result.message || '讀取資料失敗');
            shifts = Array.isArray(result.data) ? result.data : [];
            setStatus('據點連線正常');
            render();
        } catch (error) {
            console.error(error);
            setStatus(`${error.message}。請確認 GAS 已部署最新版本。`);
        }
    }

    function saveSession(session) {
        hostSession = session;
        sessionStorage.setItem('ff14HostSession', JSON.stringify(session));
        renderSession();
    }

    function restoreSession() {
        try {
            const saved = sessionStorage.getItem('ff14HostSession');
            if (saved) hostSession = JSON.parse(saved);
        } catch (error) {
            sessionStorage.removeItem('ff14HostSession');
        }
        renderSession();
    }

    function renderSession() {
        const loggedIn = Boolean(hostSession && hostSession.displayName);
        loginBox.classList.toggle('hidden', loggedIn);
        adminBox.classList.toggle('hidden', !loggedIn);
        gameOptions.textContent = '';

        if (!loggedIn) return;

        hostHint.textContent = `目前登入：${hostSession.displayName}`;
        (hostSession.games || []).forEach((game, index) => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = game;
            checkbox.checked = index === 0;
            label.append(checkbox, document.createTextNode(game));
            gameOptions.appendChild(label);
        });
    }

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) return alert('請輸入帳號與密碼');

        loginBtn.disabled = true;
        loginBtn.textContent = '登入中...';
        try {
            const result = await postJson({ action: 'login', username, password });
            saveSession({ displayName: result.displayName, games: result.games || [] });
            alert(`歡迎，${result.displayName}`);
        } catch (error) {
            console.error(error);
            alert(error.message || '登入失敗');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = '登入';
        }
    }

    function logout() {
        hostSession = null;
        sessionStorage.removeItem('ff14HostSession');
        renderSession();
    }

    async function addShift() {
        if (!hostSession) return alert('請先登入主持人帳號');
        const date = document.getElementById('opDate').value;
        const startTime = document.getElementById('opStart').value;
        const endTime = document.getElementById('opEnd').value;
        const gamesOffered = Array.from(gameOptions.querySelectorAll('input:checked')).map((input) => input.value);

        if (!date) return alert('請選擇日期');
        if (!startTime || !endTime) return alert('請填寫開始與結束時間');
        if (startTime >= endTime) return alert('結束時間必須晚於開始時間');
        if (!gamesOffered.length) return alert('請至少選擇一個可主持遊戲');

        addOpBtn.disabled = true;
        addOpBtn.textContent = '發布中...';
        try {
            await postJson({
                action: 'addShift',
                date,
                startTime,
                endTime,
                host: hostSession.displayName,
                gamesOffered
            });
            alert('時段已發布');
            await fetchData();
        } catch (error) {
            console.error(error);
            alert(error.message || '發布失敗，請稍後再試。');
        } finally {
            addOpBtn.disabled = false;
            addOpBtn.textContent = '發布召集令';
        }
    }

    async function endShift(shiftId) {
        if (!hostSession) return alert('請先登入主持人帳號');
        if (!confirm('確認結束此班表？')) return;
        try {
            await postJson({ action: 'endShift', shiftId });
            alert('班表已結束');
            await fetchData();
        } catch (error) {
            console.error(error);
            alert(error.message || '操作失敗，請稍後再試。');
        }
    }

    function appendEmpty(container, text) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = text;
        container.appendChild(empty);
    }

    function createActionButton(label, className, handler) {
        const button = document.createElement('button');
        button.className = `btn ${className}`;
        button.type = 'button';
        button.textContent = label;
        button.addEventListener('click', handler);
        return button;
    }

    function renderBooking(booking) {
        const row = document.createElement('div');
        row.className = 'booking-row';

        const title = document.createElement('strong');
        title.textContent = `[${booking.game || '未指定遊戲'}] ${booking.type || '未指定類型'}`;

        const meta = document.createElement('p');
        const total = Number(booking.playerCount || 0) + Number(booking.joinedCount || 0);
        meta.textContent = `${booking.startTime || '--:--'} - ${booking.endTime || '--:--'} / ${total} 人 / 局數：${booking.rounds || '-'}`;

        row.append(title, meta);
        return row;
    }

    function renderShift(shift) {
        const card = document.createElement('div');
        card.className = 'card';

        const titleRow = document.createElement('div');
        titleRow.className = 'card-title';
        const title = document.createElement('strong');
        title.textContent = `${shift.date || '未指定日期'} (${shift.startTime || '--:--'} - ${shift.endTime || '--:--'})`;
        const status = document.createElement('span');
        status.className = 'status';
        status.textContent = shift.status || 'unknown';
        titleRow.append(title, status);

        const meta = document.createElement('p');
        meta.textContent = `主持人：${shift.host || '未指定'} / 遊戲：${(shift.gamesOffered || []).join('、') || '未設定'}`;

        const bookings = document.createElement('div');
        if (shift.bookings && shift.bookings.length) {
            shift.bookings.forEach((booking) => bookings.appendChild(renderBooking(booking)));
        } else {
            appendEmpty(bookings, '尚無預約');
        }

        const actions = document.createElement('div');
        actions.className = 'actions';
        if (shift.status === '開放中') {
            actions.appendChild(createActionButton('結束班表', 'btn-delete', () => endShift(shift.shiftId)));
        }

        card.append(titleRow, meta, bookings, actions);
        return card;
    }

    function render() {
        const sorted = shifts
            .slice()
            .sort((a, b) => `${a.date || ''}${a.startTime || ''}`.localeCompare(`${b.date || ''}${b.startTime || ''}`));

        shiftList.textContent = '';
        if (sorted.length) sorted.forEach((shift) => shiftList.appendChild(renderShift(shift)));
        else appendEmpty(shiftList, '尚無班表');
    }

    loginBtn.addEventListener('click', login);
    logoutBtn.addEventListener('click', logout);
    addOpBtn.addEventListener('click', addShift);
    refreshBtn.addEventListener('click', fetchData);
    restoreSession();
    fetchData();
</script>
</body>
</html>
