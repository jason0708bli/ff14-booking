<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主持人後台 - 光之意志桌遊酒館</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dark: #8a6a1e;
      --bg-deep: #080812;
      --bg-card: #151521;
      --text-main: #efe4c8;
      --text-muted: #968a76;
      --border-gold: rgba(201, 168, 76, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Noto Serif TC', serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 10% 10%, rgba(201,168,76,0.10), transparent 28rem),
        radial-gradient(circle at 80% 25%, rgba(110,70,190,0.16), transparent 32rem),
        linear-gradient(180deg, #060610 0%, var(--bg-deep) 100%);
      min-height: 100vh;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-text { color: var(--gold); }
    .glass {
      background: rgba(21,21,33,.88);
      border: 1px solid var(--border-gold);
      box-shadow: 0 20px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.04);
      backdrop-filter: blur(12px);
    }
    .field {
      width: 100%;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(201,168,76,.24);
      border-radius: .85rem;
      color: var(--text-main);
      padding: .85rem 1rem;
      outline: none;
    }
    .field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.13); }
    .field option { background: #151521; color: var(--text-main); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      color: #0b0b12;
      font-weight: 900;
      border-radius: 999px;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 24px rgba(201,168,76,.2);
    }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 12px 34px rgba(201,168,76,.34); }
    .btn-ghost {
      border: 1px solid rgba(201,168,76,.35);
      color: var(--gold-light);
      border-radius: 999px;
    }
    .btn-danger {
      border: 1px solid rgba(240,100,100,.4);
      color: #ffb0b0;
      background: rgba(180,40,40,.12);
      border-radius: 999px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid rgba(201,168,76,.26);
      padding: .25rem .75rem;
      font-size: .75rem;
      color: var(--gold-light);
      background: rgba(201,168,76,.08);
    }
    .badge-green { color: #78e6a2; border-color: rgba(120,230,162,.35); background: rgba(120,230,162,.1); }
    .badge-red { color: #f08a8a; border-color: rgba(240,138,138,.35); background: rgba(240,138,138,.1); }
    .badge-purple { color: #c6a0ff; border-color: rgba(198,160,255,.35); background: rgba(198,160,255,.1); }
    .spinner {
      width: 22px; height: 22px; border: 3px solid rgba(201,168,76,.25);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav class="sticky top-0 z-50 bg-[#080812]/85 border-b border-[rgba(201,168,76,0.18)] backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <a href="index.html" class="font-cinzel tracking-[0.24em] font-black gold-text">WILL OF LIGHT</a>
        <p class="text-xs text-[var(--text-muted)]">主持人管理後台</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="connectionStatus" class="badge">未連線</span>
        <span id="hostLabel" class="hidden text-sm text-[var(--text-muted)]"></span>
        <button id="logoutBtn" class="btn-ghost px-4 py-2 hidden" onclick="logout()">登出</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <section id="loginSection" class="min-h-[70vh] flex items-center justify-center">
      <div class="glass rounded-3xl p-8 md:p-10 w-full max-w-md">
        <p class="font-cinzel tracking-[0.35em] text-sm gold-text text-center">HOST LOGIN</p>
        <h1 class="text-3xl font-black text-center mt-3 mb-8">主持人登入</h1>
        <form id="loginForm" class="grid gap-5">
          <label class="grid gap-2">
            <span class="text-sm gold-text font-bold">帳號</span>
            <input id="username" class="field" autocomplete="username" required>
          </label>
          <label class="grid gap-2">
            <span class="text-sm gold-text font-bold">密碼</span>
            <input id="password" class="field" type="password" autocomplete="current-password" required>
          </label>
          <button id="loginBtn" class="btn-gold px-8 py-4">登入後台</button>
          <p id="loginError" class="hidden rounded-2xl border border-red-400/30 bg-red-500/10 text-red-200 p-4 text-sm"></p>
        </form>
      </div>
    </section>

    <section id="adminSection" class="hidden">
      <div class="grid md:grid-cols-4 gap-4 mb-8">
        <div class="glass rounded-3xl p-5 text-center">
          <p id="statTotal" class="font-cinzel text-4xl gold-text">0</p>
          <p class="text-xs text-[var(--text-muted)] mt-1">我的場次</p>
        </div>
        <div class="glass rounded-3xl p-5 text-center">
          <p id="statOpen" class="font-cinzel text-4xl text-green-300">0</p>
          <p class="text-xs text-[var(--text-muted)] mt-1">開放中</p>
        </div>
        <div class="glass rounded-3xl p-5 text-center">
          <p id="statFull" class="font-cinzel text-4xl text-red-300">0</p>
          <p class="text-xs text-[var(--text-muted)] mt-1">已滿團</p>
        </div>
        <div class="glass rounded-3xl p-5 text-center">
          <p id="statPlayers" class="font-cinzel text-4xl text-purple-300">0</p>
          <p class="text-xs text-[var(--text-muted)] mt-1">預約人數</p>
        </div>
      </div>

      <div class="grid lg:grid-cols-[420px_1fr] gap-6">
        <section class="glass rounded-3xl p-6 md:p-8">
          <span class="badge mb-5">CREATE SLOT</span>
          <h2 class="text-3xl font-black gold-text mb-6">釋出時段</h2>
          <form id="slotForm" class="grid gap-5">
            <label class="grid gap-2">
              <span class="text-sm gold-text font-bold">日期</span>
              <input id="slotDate" class="field" type="date" required>
            </label>
            <div class="grid grid-cols-2 gap-4">
              <label class="grid gap-2">
                <span class="text-sm gold-text font-bold">開始</span>
                <select id="startTime" class="field" required></select>
              </label>
              <label class="grid gap-2">
                <span class="text-sm gold-text font-bold">結束</span>
                <select id="endTime" class="field" required></select>
              </label>
            </div>
            <label class="grid gap-2">
              <span class="text-sm gold-text font-bold">今天想帶的遊戲</span>
              <select id="game" class="field" required>
                <option value="阿瓦隆">阿瓦隆</option>
                <option value="阿瓦隆2">阿瓦隆2</option>
                <option value="璀璨寶石">璀璨寶石</option>
                <option value="TRPG">TRPG</option>
              </select>
            </label>
            <button id="slotBtn" class="btn-gold px-8 py-4">發布開團</button>
          </form>
        </section>

        <section class="glass rounded-3xl p-6 md:p-8">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
              <span class="badge mb-3">MY BOOKINGS</span>
              <h2 class="text-3xl font-black gold-text">我的場次</h2>
            </div>
            <button class="btn-ghost px-5 py-3" onclick="loadBookings()">重新整理</button>
          </div>
          <div id="bookingState" class="rounded-3xl border border-[rgba(201,168,76,0.16)] bg-black/20 p-8 text-center text-[var(--text-muted)]">
            登入後顯示場次。
          </div>
          <div id="bookingList" class="grid gap-4"></div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const GAS_API_URL = 'PASTE_YOUR_GAS_WEB_APP_URL_HERE';
    const STATUS_OPEN = '開放預約中';
    const STATUS_FULL = '已滿團';
    const STATUS_GEM = '使用寶石兌換';
    const STATUS_ENDED = '已結束';

    const state = {
      host: null,
      bookings: []
    };

    const el = {
      connectionStatus: document.getElementById('connectionStatus'),
      hostLabel: document.getElementById('hostLabel'),
      logoutBtn: document.getElementById('logoutBtn'),
      loginSection: document.getElementById('loginSection'),
      adminSection: document.getElementById('adminSection'),
      loginForm: document.getElementById('loginForm'),
      loginBtn: document.getElementById('loginBtn'),
      loginError: document.getElementById('loginError'),
      username: document.getElementById('username'),
      password: document.getElementById('password'),
      slotForm: document.getElementById('slotForm'),
      slotDate: document.getElementById('slotDate'),
      startTime: document.getElementById('startTime'),
      endTime: document.getElementById('endTime'),
      game: document.getElementById('game'),
      slotBtn: document.getElementById('slotBtn'),
      bookingState: document.getElementById('bookingState'),
      bookingList: document.getElementById('bookingList')
    };

    document.addEventListener('DOMContentLoaded', () => {
      buildTimeOptions();
      const today = new Date().toISOString().slice(0, 10);
      el.slotDate.value = today;
      el.slotDate.min = today;
      el.loginForm.addEventListener('submit', login);
      el.slotForm.addEventListener('submit', createSlot);
      restoreSession();
      checkConnection();
    });

    function isApiConfigured() {
      return GAS_API_URL && !GAS_API_URL.includes('PASTE_YOUR_GAS_WEB_APP_URL_HERE');
    }

    function buildTimeOptions() {
      const options = ['<option value="">選擇</option>'];
      for (let h = 0; h < 24; h += 1) {
        for (let m = 0; m < 60; m += 30) {
          const time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          options.push(`<option value="${time}">${time}</option>`);
        }
      }
      el.startTime.innerHTML = options.join('');
      el.endTime.innerHTML = options.join('');
      el.startTime.value = '18:00';
      el.endTime.value = '22:00';
    }

    async function checkConnection() {
      if (!isApiConfigured()) {
        setConnection(false, '尚未設定 GAS URL');
        return;
      }
      try {
        const res = await fetch(`${GAS_API_URL}?action=listBookings&t=${Date.now()}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        setConnection(true, '系統連線正常');
      } catch (error) {
        setConnection(false, '系統連線異常');
      }
    }

    function setConnection(ok, text) {
      el.connectionStatus.className = ok ? 'badge badge-green' : 'badge badge-red';
      el.connectionStatus.textContent = text;
    }

    function restoreSession() {
      try {
        const saved = sessionStorage.getItem('ff14Host');
        if (saved) {
          state.host = JSON.parse(saved);
          showAdmin();
          loadBookings();
        }
      } catch (error) {
        sessionStorage.removeItem('ff14Host');
      }
    }

    async function login(event) {
      event.preventDefault();
      if (!isApiConfigured()) return showLoginError('請先設定 GAS_API_URL。');
      setBusy(el.loginBtn, true, '登入中...');
      hideLoginError();
      try {
        const data = await postAction({
          action: 'login',
          username: el.username.value.trim(),
          password: el.password.value
        });
        state.host = data.host;
        sessionStorage.setItem('ff14Host', JSON.stringify(state.host));
        showAdmin();
        await loadBookings();
      } catch (error) {
        showLoginError(error.message || '登入失敗。');
      } finally {
        setBusy(el.loginBtn, false, '登入後台');
      }
    }

    function showAdmin() {
      el.loginSection.classList.add('hidden');
      el.adminSection.classList.remove('hidden');
      el.hostLabel.classList.remove('hidden');
      el.logoutBtn.classList.remove('hidden');
      el.hostLabel.textContent = `目前登入：${state.host.displayName}`;
    }

    function logout() {
      state.host = null;
      state.bookings = [];
      sessionStorage.removeItem('ff14Host');
      el.loginSection.classList.remove('hidden');
      el.adminSection.classList.add('hidden');
      el.hostLabel.classList.add('hidden');
      el.logoutBtn.classList.add('hidden');
    }

    async function createSlot(event) {
      event.preventDefault();
      if (!state.host) return alert('請先登入。');
      if (el.startTime.value >= el.endTime.value) return alert('結束時間必須晚於開始時間。');

      setBusy(el.slotBtn, true, '發布中...');
      try {
        const data = await postAction({
          action: 'createSlot',
          host: state.host,
          date: el.slotDate.value,
          startTime: el.startTime.value,
          endTime: el.endTime.value,
          game: el.game.value
        });
        alert(data.message || '時段已發布。');
        await loadBookings();
      } catch (error) {
        alert(error.message || '發布失敗。');
      } finally {
        setBusy(el.slotBtn, false, '發布開團');
      }
    }

    async function loadBookings() {
      if (!state.host) return;
      el.bookingState.hidden = false;
      el.bookingState.innerHTML = '<div class="spinner mx-auto mb-4"></div>正在載入場次...';
      el.bookingList.innerHTML = '';
      try {
        const res = await fetch(`${GAS_API_URL}?action=listBookings&t=${Date.now()}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '讀取失敗');
        state.bookings = (data.bookings || []).filter((booking) => booking.hostUsername === state.host.username);
        renderStats();
        renderBookings();
      } catch (error) {
        el.bookingState.innerHTML = escapeHtml(error.message || '讀取失敗。');
      }
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = state.bookings.length;
      document.getElementById('statOpen').textContent = state.bookings.filter((b) => b.status === STATUS_OPEN).length;
      document.getElementById('statFull').textContent = state.bookings.filter((b) => b.status === STATUS_FULL || b.status === STATUS_GEM).length;
      document.getElementById('statPlayers').textContent = state.bookings.reduce((sum, b) => sum + Number(b.currentPlayers || 0), 0);
    }

    function renderBookings() {
      if (!state.bookings.length) {
        el.bookingState.hidden = false;
        el.bookingState.textContent = '目前沒有場次。';
        return;
      }
      el.bookingState.hidden = true;
      el.bookingList.innerHTML = '';
      state.bookings
        .slice()
        .sort((a, b) => `${a.date}${a.startTime}`.localeCompare(`${b.date}${b.startTime}`))
        .forEach((booking) => el.bookingList.appendChild(createBookingRow(booking)));
    }

    function createBookingRow(booking) {
      const row = document.createElement('article');
      row.className = 'rounded-3xl border border-[rgba(201,168,76,0.18)] bg-black/20 p-5';
      row.innerHTML = `
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
          <div>
            <p class="text-sm text-[var(--text-muted)]">${escapeHtml(booking.date)} / ${escapeHtml(booking.startTime)} - ${escapeHtml(booking.endTime)}</p>
            <h3 class="text-2xl font-black gold-text mt-1">${escapeHtml(booking.game)}</h3>
            <p class="text-sm text-[var(--text-muted)] mt-1">模式：${escapeHtml(booking.mode)} / 人數：${Number(booking.currentPlayers)}/${Number(booking.maxPlayers)}</p>
            <p class="text-sm text-[var(--text-muted)] mt-1">費用：${Number(booking.totalFeeWan || 0)} 萬金幣</p>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            ${statusBadge(booking.status)}
            ${booking.status !== STATUS_ENDED ? '<button class="end-action btn-danger px-4 py-2">結束場次</button>' : ''}
          </div>
        </div>
      `;
      row.querySelector('.end-action')?.addEventListener('click', () => endBooking(booking.bookingId));
      return row;
    }

    function statusBadge(status) {
      if (status === STATUS_OPEN) return '<span class="badge badge-green">開放中</span>';
      if (status === STATUS_FULL) return '<span class="badge badge-red">已滿團</span>';
      if (status === STATUS_GEM) return '<span class="badge badge-purple">寶石兌換</span>';
      if (status === STATUS_ENDED) return '<span class="badge">已結束</span>';
      return `<span class="badge">${escapeHtml(status || '未知')}</span>`;
    }

    async function endBooking(bookingId) {
      if (!confirm('確定要結束此場次嗎？')) return;
      try {
        const data = await postAction({ action: 'endBooking', bookingId });
        alert(data.message || '場次已結束。');
        await loadBookings();
      } catch (error) {
        alert(error.message || '操作失敗。');
      }
    }

    async function postAction(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || '操作失敗');
      return data;
    }

    function showLoginError(message) {
      el.loginError.textContent = message;
      el.loginError.classList.remove('hidden');
    }

    function hideLoginError() {
      el.loginError.classList.add('hidden');
    }

    function setBusy(button, busy, text) {
      button.disabled = busy;
      button.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }
  </script>
</body>
</html>
