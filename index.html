<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>光之意志桌遊酒館 ─ FF14 RP 桌遊店</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dark: #8a6a1e;
      --blue-gem: #4090d0;
      --red-gem: #d04050;
      --purple-gem: #9060c0;
      --bg-deep: #0a0a12;
      --bg-card: #13131c;
      --border-gold: rgba(201,168,76,0.3);
      --text-main: #e8dfc8;
      --text-muted: #7a7060;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Serif TC', serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-text { color: var(--gold); }
    
    /* 星空背景 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 10% 10%, #fff, transparent),
        radial-gradient(1px 1px at 20% 50%, #fff, transparent),
        radial-gradient(2px 2px at 40% 80%, #fff, transparent),
        radial-gradient(1px 1px at 60% 20%, #fff, transparent),
        radial-gradient(2px 2px at 80% 40%, #fff, transparent),
        radial-gradient(1px 1px at 90% 70%, #fff, transparent);
      background-size: 1000px 1000px;
      opacity: 0.15;
      z-index: -1;
    }

    /* 燈號格子 */
    .slot-grid { display: flex; gap: 4px; margin-top: 8px; }
    .slot-dot { width: 12px; height: 12px; border-radius: 2px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
    .slot-dot.green { background: #4ade80; box-shadow: 0 0 8px #4ade80; border: none; }
    .slot-dot.purple { background: #a855f7; box-shadow: 0 0 8px #a855f7; border: none; }

    /* 下拉選單修正 */
    select option { background-color: var(--bg-deep); color: white; }

    /* 其他樣式 */
    .hero-gradient { background: linear-gradient(to bottom, transparent, var(--bg-deep)); }
    .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: 0 10px 30px -10px rgba(201,168,76,0.3); }
    .btn-gold { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #000; font-weight: 700; transition: all 0.3s; }
    .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(201,168,76,0.4); }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(201,168,76,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 連線狀態指示燈 */
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .status-dot-inner { width: 8px; height: 8px; border-radius: 50%; }
    .status-online { color: #50c878; border-color: rgba(80,200,120,0.3); }
    .status-online .status-dot-inner { background: #50c878; box-shadow: 0 0 8px #50c878; }
    .status-offline { color: #e05050; border-color: rgba(224,80,80,0.3); }
    .status-offline .status-dot-inner { background: #e05050; box-shadow: 0 0 8px #e05050; }
    .status-checking { color: #c9a84c; border-color: rgba(201,168,76,0.3); }
    .status-checking .status-dot-inner { background: #c9a84c; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-bg-deep/80 backdrop-blur-md border-b border-gold/10 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="font-cinzel text-gold font-bold tracking-widest">WILL OF LIGHT</div>
      <div class="flex items-center gap-4">
        <!-- 連線狀態指示 -->
        <div id="connectionStatus" class="status-indicator status-checking">
          <div class="status-dot-inner"></div>
          <span id="statusText">連線檢查中...</span>
        </div>
        <a href="admin.html" class="text-xs text-text-muted hover:text-gold transition-colors">主持人後台</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="relative h-screen flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 z-0">
      <div class="absolute inset-0 bg-gradient-to-b from-purple-900/20 to-transparent opacity-60"></div>
      <div class="absolute inset-0 hero-gradient"></div>
    </div>
    <div class="relative z-10 text-center px-4">
      <div class="mb-6 inline-block border-y border-gold/40 py-2 px-8">
        <span class="font-cinzel tracking-[0.5em] text-gold text-sm md:text-base">EST. 2024 ─ EOZEA</span>
      </div>
      <h1 class="font-cinzel text-5xl md:text-8xl font-black mb-6 tracking-tighter">
        <span class="block text-white opacity-90">WILL OF LIGHT</span>
        <span class="block gold-text mt-2">光之意志</span>
      </h1>
      <p class="text-lg md:text-2xl text-text-muted mb-12 max-w-2xl mx-auto leading-relaxed font-light tracking-widest">
        在星辰交織的酒館中，開啟屬於您的冒險棋局
      </p>
      <div class="flex flex-col md:flex-row gap-6 justify-center">
        <button onclick="scrollTo('#lobby')" class="btn-gold px-12 py-4 rounded-full text-lg tracking-widest">立即預約冒險</button>
        <button onclick="scrollTo('#rules')" class="border border-gold/50 text-gold px-12 py-4 rounded-full text-lg tracking-widest hover:bg-gold/10 transition-all">冒險須知</button>
      </div>
    </div>
  </section>

  <!-- 預約大廳 -->
  <section id="lobby" class="py-24 px-4 max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
      <div>
        <h2 class="font-cinzel text-4xl font-bold gold-text mb-4">ADVENTURE LOBBY</h2>
        <p class="text-text-muted tracking-widest">當前開放預約的冒險時段</p>
      </div>
      <button onclick="loadLobby()" class="flex items-center gap-2 text-gold hover:text-gold-light transition-colors group">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span class="tracking-widest">重新整理大廳</span>
      </button>
    </div>
